[package]
name = "lowpass"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Reference AudioServerPlugin: a stateful one-pole low-pass virtual device"
publish = false

# `cdylib` is the loadable plug-in binary that goes inside
# `LowPass.driver/Contents/MacOS/` — `plugin_entry!` emits its
# `TympanAsplDriverFactory` entry point. `rlib` is kept so the
# crate's unit tests still build and link against the `Driver`
# implementation directly.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tympan-aspl = { path = "../.." }

[dev-dependencies]
# `tests/no_alloc.rs` installs `AllocDisabler` as the test binary's
# global allocator to prove this example's `process_io` is
# allocation-free. `default-features = false` switches off the
# `disable_release` feature so the guard stays armed when Tier 1's
# `cargo build --release --all-targets` compiles the test target.
assert_no_alloc = { version = "1.1", default-features = false }

[lints]
workspace = true
